spec_version: 1.0.0
principle: Не считать единый «переговорный рейтинг». Оценивать наблюдаемые навыки курса отдельно.
turn_evaluation:
  A_situation_recognition:
    skills:
    - conflict_vs_negotiation
    - negotiation_topic_vs_conflict_goal
    - conflict_type
    - conflict_stage
    - decoding
    - manipulation_detection
    - negotiation_layers
    - causal_vs_critical_problem
    status_values:
    - observed
    - correct
    - partially_correct
    - incorrect
    - harmful_risky
    evidence_required: true
  B_tool_selection:
    questions:
    - Соответствует ли техника входу/этапу?
    - Учитывает ли прямые ограничения и риски из курса?
    - Не перескакивает ли студент к рациональному до прекращения влияния конфликта?
    status_values:
    - observed
    - correct
    - partially_correct
    - incorrect
    - harmful_risky
  C_wording_quality:
    checks:
    - Факт не подменён оценкой, если используется обратная связь.
    - Я-эмоция не подменена обвинением «ты меня...».
    - Я-ощущение маркирует интерпретацию как ощущение/гипотезу.
    - Управленческое воздействие одно и в конце, если применяется соответствующая схема.
    - Вопрос не содержит нескольких несвязанных вопросов, если оценивается сбор информации.
    - Фраза сохраняет логическую связность; не содержит разрыва смыслов через «но», который создаёт лишние точки давления.
    status_values:
    - observed
    - correct
    - partially_correct
    - incorrect
    - harmful_risky
  D_dialogue_dynamics:
    checks:
    - Студент использует реакцию оппонента как информацию.
    - Переходит на минимально достаточный следующий этап.
    - После временного перехода к переговорной теме не забывает вернуться к цели на конфликт.
    - При аргументации/воздействии работает итерационно, если ситуация это допускает.
    - При сборе информации проверяет достоверность/полноту/логику и собственное понимание.
    status_values:
    - observed
    - correct
    - partially_correct
    - incorrect
    - harmful_risky
skill_rubrics:
  conflict.audit_negativity:
    observed_when: Предотвратить конфликт, заранее озвучив возможное негативное впечатление/стереотип/опасение.
    correct:
    - Условия входа соответствуют ситуации.
    - Сохранён ключевой механизм приёма из материалов курса.
    - Формулировка не нарушает прямые ограничения приёма.
    partially_correct:
    - Выбран релевантный приём, но пропущен существенный шаг/проверка или формулировка повышает обозначенный в курсе риск.
    incorrect:
    - Приём выбран не для того этапа/механизма либо отсутствует его ключевой элемент.
    harmful_risky: []
    explanation_basis: Опираться на entry_conditions, algorithm, do_not_use_when и risks соответствующей техники.
    source_refs:
    - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
      page: 46
      context: 'Аудит негатива: говорить наперёд, что человек может подумать; источники — стереотипы и собственные опасения.'
      confidence: explicit
    - file: НИУ ВШЭ Лекция 4-5.pdf
