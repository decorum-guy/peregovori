spec_version: 1.0.0
provenance:
  basis: Только приложенные пользователем материалы курса; внешние теории не добавлялись.
  source_policy:
  - Описание курса задаёт scope и learning outcomes.
  - Слайды — основной источник формулировок алгоритмов, моделей, этапов и терминов.
  - Полные транскрипты уточняют смысл, ограничения и риски.
  - Семинары дают примеры применения, типичные ошибки и обратную связь преподавателя.
  inference_policy: Очевидная структуризация помечается inferred; неразрешённые расхождения вынесены в ambiguities.md.
course:
  title: Ведение переговоров / Negotiation Skills
  goals:
  - Системное и комплексное понимание переговорного процесса.
  - 'Навык осознанной коммуникации: понимать, что и почему делается в каждый момент.'
  - Умение выстраивать долгосрочные и экологичные отношения.
  - Системное и комплексное понимание конфликтного процесса.
  learning_outcomes:
  - Различать тему на переговоры и цель на конфликт; определять этап конфликта; декодировать; обрабатывать эмоции; показывать
    и защищать границы; давать обратную связь; определять основания для сепарации/эскалации.
  - Определять манипуляцию и стратегию манипулятора; применять базовые и причинно-следственные способы противодействия; знать
    заявленные программой ошибки защиты.
  - 'Готовить переговоры: находить проблемы по слоям, причинные/критичные проблемы, анализировать цели, базовую точку, точку
    L, решения, ресурсы и ключевые точки.'
  - 'Решать тактические задачи: собирать и проверять информацию, анализировать чужую картину мира, декомпозировать позицию,
    строить мостик, аргументировать и выбирать управленческое воздействие.'
  source_refs:
  - file: Описание курса «Ведение переговоров».txt
    page: null
    context: Цели, learning outcomes и тематический план курса.
    confidence: explicit
concepts:
- id: conflict
  russian_name: конфликт
  definition: Нарушение/сдвижение неформальных социальных ролей и/или нарушение личных границ.
  distinguish_from:
  - 'Переговоры: рациональная работа по предмету/проблеме; простого расхождения интересов недостаточно для конфликта в операционном
    определении курса.'
  recognition_rules:
  - Искать сдвиг неформальной роли и/или нарушение границы.
  - Если конфликт влияет на переговоры, его нельзя игнорировать.
  source_refs:
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 14
    context: Определение конфликта.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 17
    context: Нельзя вести переговоры, пока конфликт влияет.
    confidence: explicit
- id: negotiation_topic
  russian_name: тема на переговоры
  definition: Тема, которая обсуждалась сторонами до появления конфликта; рациональный предмет, который нужно решать отдельно
    от цели на конфликт.
  distinguish_from:
  - Цель на конфликт — долгосрочное состояние ролей/границ/отношений.
  recognition_rules:
  - Спросить, о чём стороны спорили/договаривались до конфликтной реплики.
  - Предположить, что тема переговоров уже решена, и проверить, остаётся ли долгосрочная проблема ролей/границ.
  source_refs:
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 87
    context: Определение темы на переговоры.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 90
    context: Проверочный вопрос для отделения цели конфликта.
    confidence: explicit
- id: conflict_goal
  russian_name: цель на конфликт
  definition: Желаемое долгосрочное состояние отношений, границ или публичной социальной роли, которое нужно закрыть отдельно
    от рациональной темы переговоров.
  distinguish_from:
  - Тема на переговоры.
  recognition_rules:
  - 'Личный шаблон: «Я хочу, чтобы в наших отношениях было/не было X».'
  - 'Публичный: «Я хочу, чтобы группа считала/не считала меня X».'
  - Проверять право отказать; возможность действовать без вины/стыда/страха; использование людей/ценностей для воздействия;
    нормальность желания/действия/свойства.
  source_refs:
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 89
    context: Шаблоны целей.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 92
    context: Право отказать.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 94
    context: Без вины/стыда/страха.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 96
    context: Не использовать ценности/людей для воздействия.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 98
    context: Нормальность желания/действия/свойства.
    confidence: explicit
- id: social_role
  russian_name: социальная роль
  definition: Образец поведения человека, признаваемый обществом целесообразным для обладателя статуса; в курсе формальная
    и неформальная.
  distinguish_from:
  - Социальный статус — позиция человека в группе/обществе с финансовой, политической и престижной составляющими.
  recognition_rules:
  - 'Формальная: руководитель, сотрудник, родитель и т.п.'
  - 'Неформальная: лидер, неопытный, зависимый, незаменимый и т.п.'
  source_refs:
  - file: НИУ ВШЭ'26_Лекция 3-4.pdf
    page: 3
    context: Определение и формальная/неформальная роль.
    confidence: explicit
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 44
    context: Социальный статус и его составляющие.
    confidence: explicit
- id: decoding
  russian_name: декодирование
  definition: Навык вскрытия сути конфликта через выявление неформальной социальной роли, которую фраза приписывает участникам.
  distinguish_from:
  - Декомпозиция — разложение чужой позиции на смыслы и логические связи.
  recognition_rules:
  - Определить формальные роли.
  - 'Спросить: «Какая я <формальная роль> в этой фразе?»'
  - Проверить эквивалентность исходной фразе формулой «Ты — <неформальная роль>».
  source_refs:
  - file: НИУ ВШЭ'26_Лекция 3-4.pdf
    page: 4
    context: Алгоритм декодирования.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 3-4.pdf
    page: 19
    context: Саммари навыка.
    confidence: explicit
- id: decomposition
  russian_name: декомпозиция
  definition: Разложение чужой позиции на отдельные смыслы и логические связи между ними.
  distinguish_from:
  - Декодирование — поиск неформальной социальной роли в конфликтной реплике.
  recognition_rules:
  - Выделить все смыслы.
  - Связать «и», «или», «следовательно/следствие».
  - Классификация смыслов вторична по отношению к полноте смыслов и связей.
  source_refs:
  - file: Ведение переговоров 28.09 лекция 1+2.pdf
    page: 1
    context: Алгоритм декомпозиции.
    confidence: explicit
  - file: Ведение переговоров 28.09 лекция 1+2.pdf
    page: 9
    context: Приоритет смыслов и связей.
    confidence: explicit
- id: causal_problem
  russian_name: причинная проблема
  definition: Проблема, отвечающая на вопрос «Что должно было работать по-другому, чтобы этой проблемы не было?».
  distinguish_from:
  - Критичная проблема — без решения которой хотя бы одна сторона не согласится уйти с переговоров.
  recognition_rules:
  - Искать предпосылку появления симптома.
  source_refs:
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 9
    context: Причинная и критичная проблемы.
    confidence: explicit
- id: critical_problem
  russian_name: критичная проблема
  definition: Проблема, без решения которой хотя бы одна сторона не согласится завершить переговоры.
  distinguish_from:
  - Причинная проблема.
  recognition_rules:
  - Проверить, без решения чего сторона не согласится уйти с переговоров.
  source_refs:
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 9
    context: Определение критичной проблемы.
    confidence: explicit
- id: baseline
  russian_name: базовая точка
  definition: Что будет с нами и собеседником, если мы не договоримся; она не статична и может быть изменена до переговоров.
  distinguish_from:
  - Точка L — сценарий взаимного нанесения вреда.
  recognition_rules:
  - Описать последствия отсутствия договорённости для обеих сторон.
  - Уточнить неизвестные данные.
  - Оценить, как улучшить свою или ухудшить чужую базовую точку до переговоров.
  source_refs:
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 14
    context: Определение базовой точки и её динамичность.
    confidence: explicit
- id: point_L
  russian_name: точка L / Lose-lose точка
  definition: Точка, в которой обе стороны стремятся нанести вред друг другу.
  distinguish_from:
  - Базовая точка — последствия обычного отсутствия договорённости.
  recognition_rules:
  - Что другая сторона может сделать нам при провале?
  - Что можем сделать мы?
  - Как защититься от нападения?
  source_refs:
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 16
    context: Определение и вопросы анализа точки L.
    confidence: explicit
- id: solution
  russian_name: решение
  definition: Конкретный способ действия; при подготовке описывается через содержание, стоимость и сроки.
  distinguish_from:
  - Результат — то, чего решение должно добиться; позиция — то, что сторона утверждает/предлагает.
  recognition_rules:
  - Сравнить ожидаемый результат решения с целями сторон, базовой точкой и точкой L.
  source_refs:
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 24
    context: Содержание/стоимость/сроки.
    confidence: explicit
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 26
    context: Позиция → решение → результат.
    confidence: explicit
- id: resource
  russian_name: ресурс
  definition: То, что необходимо для реализации решения; включает доступные ресурсы, легко/дорого добываемые и доступные только
    другой стороне, включая полномочия.
  distinguish_from: []
  recognition_rules:
  - Разделить ресурсы по доступности и стоимости получения.
  source_refs:
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 28
    context: Четыре группы ресурсов.
    confidence: explicit
- id: key_point
  russian_name: ключевая точка
  definition: То, что можно заранее спрогнозировать в переговорах.
  distinguish_from: []
  recognition_rules:
  - 'Примеры курса: начало, критичные/причинные проблемы, отказ от переговоров, обвинение, угрозы базовой точкой/точкой L.'
  source_refs:
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 33
    context: Определение.
    confidence: explicit
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 34
    context: Примеры ключевых точек.
    confidence: explicit
- id: managerial_action
  russian_name: управленческое воздействие
  definition: 'Явное действие фразы, направленное на реакцию собеседника: вопрос, право на отказ/эмоцию/границу, просьба/предложение,
    приказ/требование, последствие/угроза; отсутствие воздействия отдельно отмечено как нежелательное.'
  distinguish_from:
  - Аргументация объясняет, почему; управленческое воздействие задаёт, что сделать/ответить.
  recognition_rules:
  - Обычно одно воздействие.
  - Ставить в конец фразы.
  source_refs:
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 62
    context: Варианты воздействий.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 63
    context: Одно воздействие и в конце.
    confidence: explicit
conflict:
  definition: Нарушение/сдвижение неформальных социальных ролей и/или нарушение личных границ.
  types:
  - id: personal
    russian_name: личный
    rule: Задействованы два участника.
  - id: public
    russian_name: публичный
    rule: Участников больше двух и нет личных отношений; одна публичная фаза.
  - id: mixed
    russian_name: смешанный
    rule: 'Публичный конфликт при наличии личных отношений; две фазы: публичная и личная.'
  stages:
  - id: conflict.stage.emotion_processing
    russian_name: обработка эмоций
    entry: Есть подозрение, что это эмоция.
    goal: Помочь осознать состояние и перейти к рациональному решению/переговорам либо к выстраиванию границ.
    source_refs:
    - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
      page: 22
      context: Вход и задача этапа.
      confidence: explicit
  - id: conflict.stage.boundary_statement
    russian_name: показывание границ
    entry: Граница нарушается ненарочно.
    goal: Выстроить границы/правила на будущее, исправить проблему отношений.
    source_refs:
    - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
      page: 53
      context: Вход и задача этапа.
      confidence: explicit
  - id: conflict.stage.boundary_defense
    russian_name: защита границ
    entry: Граница нарушается намеренно.
    goal: Добиться позитивного изменения и понизиться до этапа 2; при исчерпании перейти к этапу 4.
    source_refs:
    - file: НИУ ВШЭ'26_Лекция 3-4.pdf
      page: 73
      context: Вход и задача.
      confidence: explicit
    - file: НИУ ВШЭ'26_Лекция 3-4.pdf
      page: 89
      context: Выходы этапа.
      confidence: explicit
  - id: conflict.stage.separation_escalation
    russian_name: сепарация / эскалация
    entry: Первые три этапа не дали приемлемого результата либо требуется прекращение/передача взаимодействия.
    goal: Дистанцировать/прекратить взаимодействие либо передать проблему человеку с полномочиями.
    source_refs:
    - file: НИУ ВШЭ'26_Лекция 3-4.pdf
      page: 95
      context: Сепарация.
      confidence: explicit
    - file: НИУ ВШЭ'26_Лекция 3-4.pdf
      page: 96
      context: Эскалация.
      confidence: explicit
  stage_transition_rules:
  - Решать конфликт на наименьшем возможном этапе.
  - Для первой фразы выбирать этап по входу; далее — по выходам предыдущего этапа.
  - Переходить к переговорам только когда конфликт перестал влиять.
  - После временного перехода в переговорную тему вернуться и закрыть цель на конфликт.
  exit_conditions:
  - Граница признана и соблюдается.
  - Позитивное изменение позволяет понизиться до более мягкого этапа.
  - Сепарация/эскалация завершает текущую ветку взаимодействия.
  negotiation_transition_rules:
  - Из этапа 1 и 3 возможен переход к рациональной теме при прекращении влияния конфликта.
  - Прямой переход со 2-го этапа помечен ambiguous из-за расхождения материалов.
  - После решения темы переговоров возвращаться к незакрытой цели на конфликт.
emotion_processing:
  techniques:
  - emotion.union
  - emotion.union_inference
  - emotion.show_importance
  - emotion.label
  risk_reduction:
  - emotion.acceptable_vocabulary
  - emotion.i_feeling
  - emotion.start_from_self
  - emotion.direct_to_self
  - emotion.fast_rational_transition
  core_rules:
  - Называть эмоцию честно; не бояться повторить обработку.
  - Если эмоциональная лексика неприемлема, использовать лексику группы/я-ощущение/начать с себя/направить эмоцию на себя
    или быстро перейти к рациональному.
boundaries:
  fact_vs_evaluation: Факт — наблюдаемое действие/бездействие/слова; оценка — интерпретация, с которой другой может не согласиться.
  feedback_components:
  - fact
  - need/value/boundary
  - i_emotion
  - i_feeling
  - managerial_action
  formula_examples:
  - Я-эмоция + Факт + Потребность + Управленческое воздействие
  - 'В личных отношениях: Я-эмоция + Факт + Потребность + Просьба'
  rules:
  - Компоненты можно менять местами, убирать и дублировать.
  - Я-эмоция отделяется от я-ощущения.
  - Управленческое воздействие одно и в конце.
  source_refs:
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 55
    context: Оценка vs факт.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 70
    context: Пример формулы.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 74
    context: Компоненты можно переставлять.
    confidence: explicit
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 76
    context: Итог обратной связи.
    confidence: explicit
decoding:
  algorithm:
  - Определить формальные социальные роли.
  - 'Спросить: «Какая я <формальная роль> в этой фразе?»'
  - Проверить эквивалентность исходной фразы и «Ты — <неформальная роль>».
  variants:
  - Называние эмоции + декодирование на этапе 1.
  - Я-ощущение + декодирование на этапе 2.
  - Вернуть декодирование на этапе 3.
  risks:
  - Ошибочная гипотеза превращается в оценку и может дать оппоненту дополнительные возможности давления.
  verification:
  - Ответ «да» и «нет» дают информацию; при «нет» можно спросить, что человек имел в виду.
manipulation:
  definition: Скрытое воздействие на эмоции с целью получить рациональную выгоду, изменить социальную роль или нарушить границу.
  goals:
  - Получить рациональную выгоду.
  - Изменить социальную роль.
  - Нарушить границу/усилить контроль над человеком или группой.
  strategies:
  - id: direction.aggressor
    mechanism: Направление будущего действия через страх/агрессора.
  - id: direction.victim
    mechanism: Направление будущего действия через стыд/жалость/позицию жертвы.
  - id: accusation.aggressor
    mechanism: Обвинение за прошлое через страх/агрессора.
  - id: accusation.victim
    mechanism: Обвинение за прошлое через стыд/жалость/позицию жертвы.
  relationship_creation:
  - Использовать существующие роли/ценности.
  - Переопределять существующие роли/ценности.
  - Создавать новые роли/ценности через эталон/антипример.
  patterns:
  - Эмоциональные качели агрессор↔жертва.
  - Направление/обвинение.
  - Эталон/антипример и сдвижение эталона.
  - Смена критерия или группы сравнения; предложение выхода из группы.
  - Атака по смыслу либо по форме.
  target_emotions:
  - страх
  - вина
  - стыд
  - жалость
  - чувство долга
  typical_victim_reactions:
  - Защита/оправдание.
  - Атака/агрессия.
  known_ambiguity: Программа заявляет четыре ошибки манипулируемого и два базовых приёма защиты; в материалах нет однозначного
    единого списка. См. ambiguities.md.
  countermeasures:
  - conflict.return_decoding
  - conflict.expose_manipulator_goal
  - conflict.show_manipulation
  - manipulation.fix_imposed_role
  - manipulation.fix_imposed_role_reverse
  - manipulation.future_action_link
  - manipulation.future_action_link_reverse
  - manipulation.imposed_obligation
  - manipulation.accept_role
  - manipulation.role_goal_link
  - manipulation.sole_objection
  - manipulation.hyperbolization
  - manipulation.offense_ban
negotiation_preparation:
  algorithm:
  - Анализ ситуации.
  - Анализ отношений.
  - Анализ решений.
  - Разработка стратегии.
  situation_analysis:
  - Найти симптомы по 5 слоям.
  - Найти причинные и критичные проблемы.
  - Для проблем оценить ущерб, выгоды, риски, возможности.
  - Проанализировать свою цель и возможную цель собеседника.
  - Проанализировать базовую точку и точку L.
  relationship_analysis:
  - Определить интересы, цели, социальные группы/друзей, ценности.
  - 'Выбрать темы: общее, возможное общее, аудит негатива, темы-табу.'
  - 'Выписать выводы: small talk, ценности и другое для аргументации.'
  solution_analysis:
  - Сгруппировать проблемы.
  - 'Разработать решения: содержание, стоимость, сроки.'
  - Сравнить с базовой точкой и точкой L.
  - Проанализировать ожидаемый результат, риски, ресурсы.
  strategy_creation:
  - Определить ключевые точки.
  - 'Подготовить фразы к ключевым точкам: что донести, воздействие/аргументы, точная фраза.'
  - Предсказать наиболее ожидаемые реакции и добавить новые ключевые точки.
  source_refs:
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 4
    context: Алгоритм подготовки.
    confidence: explicit
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 36
    context: Фразы к ключевым точкам.
    confidence: explicit
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 38
    context: Ожидаемые реакции как новые ключевые точки.
    confidence: explicit
negotiation_layers:
- id: process
  russian_name: процессный
  question: Какие проблемы в процессах или людях в процессе?
- id: legal
  russian_name: юридический
  question: Какие обязательства и как зафиксированы?
- id: ethical
  russian_name: этический
  question: Какие ценности и для кого нарушены?
- id: financial
  russian_name: финансовый
  question: Где деньги; сколько заработали/потеряли; какие финансовые риски?
- id: emotional
  russian_name: эмоциональный
  question: Какие эмоции/эмоциональные проблемы влияют на переговоры?
problem_analysis:
  causal_problems: Что должно было работать по-другому, чтобы этой проблемы не было?
  critical_problems: Без решения какой проблемы хотя бы одна сторона не согласится уйти с переговоров?
  impact:
  - ущерб
  - выгода
  - риск
  - возможность
goals_and_baselines:
  own_goal:
  - Что я хочу?
  - Почему я этого хочу?
  opponent_goal:
  - Что может хотеть собеседник?
  - Как узнать до переговоров?
  - Как узнать во время переговоров?
  baseline: Что будет с нами и собеседником, если не договоримся; можно улучшать до переговоров.
  point_L: Какие взаимные последствия/угрозы возможны при переходе к нанесению вреда и как защититься.
solutions_and_resources:
  solution_triangle:
  - content_who_what
  - cost_who_how_much
  - timing
  analysis:
  - expected_result
  - risks_and_consequences
  - required_resources
  resource_classes:
  - available_now
  - easy_to_get_without_other_side
  - possible_but_expensive
  - only_other_side_has_it_including_authority
key_points:
  definition: Прогнозируемые точки переговоров.
  examples:
  - начало переговоров
  - критичные проблемы
  - причинные проблемы
  - отказ от переговоров
  - обвинение
  - угрозы базовой точкой/точкой L
  preparation_fields:
  - что хотим донести
  - управленческое воздействие и аргументы
  - точная фраза
  - ожидаемые реакции
information_gathering:
  rules:
  - Задавать по одному вопросу.
  - Предпочтительно использовать открытые вопросы для получения информации.
  - Не начинать с обвинительного «почему», если это повышает защиту.
  - Проверять понимание перефразом или логическим продолжением.
  techniques:
  - information.open_question
  - relationship.echo
  - information.paraphrase
  - information.logical_continuation
active_listening:
  tools:
  - показ внимания/интереса
  - эхо
  - перефраз
  - логическое продолжение
  - слова собеседника
  - зеркалирование
  purpose: Расположить к себе, показать внимание и получить/проверить информацию.
decomposition:
  algorithm:
  - Выделить все смыслы.
  - Соединить логическими операторами «и», «или», «следовательно».
  - Определить типы смыслов.
  - Проверять отдельные причинно-следственные связи и пробелы.
  priority: Полнота смыслов и связей важнее вторичной классификации.
analysis_of_other_position:
  sequence:
  - Проверить достоверность.
  - Проверить полноту информации.
  - Проверить логику аргументации.
  methods:
  - анализ деталей
  - анализ общей системы
  - анализ последствий
  - анализ предпосылок
  - подмена решения
  - подмена результата
bridging:
  algorithm:
  - Повторить/отразить ключевую мысль собеседника.
  - При необходимости согласиться, частично согласиться либо обозначить несогласие/свою позицию.
  - Логически связать исходную мысль с нужным вопросом/своей темой.
  constraint: Сохранять связность; мостик должен показывать, что исходная мысль услышана.
argumentation:
  components:
  - рациональная
  - этическая
  - эмоциональная
  general: Тезис → объясняющие аргументы → данные/факты → управленческое воздействие.
  SEXI:
  - statement
  - explanation
  - example
  - importance
  PREP:
  - point
  - reason
  - example
  - point
  iteration_rule: По возможности один аргумент/одна мысль и одно управленческое воздействие; после воздействия остановиться.
managerial_action:
  types:
  - вопрос
  - право на отказ/эмоцию/границу
  - просьба
  - предложение
  - приказ/требование
  - последствие/угроза
  - без воздействия (не рекомендуется)
  rules:
  - Обычно одно воздействие.
  - В конце фразы.
solution_substitution:
  definition: Согласиться с желаемым результатом собеседника, проверить, ведёт ли предложенное им решение к результату, и
    предложить альтернативное решение.
result_substitution:
  definition: Уточнить, какой результат/потребность стоит за заявленным требованием, и предложить другой способ получить этот
    результат.
ambiguities_file: ambiguities.md
audit_trail_file: source_map.md
