- id: conflict.audit_negativity
  russian_name: Аудит негатива
  skill_group: conflict_management
  purpose: Предотвратить конфликт, заранее озвучив возможное негативное впечатление/стереотип/опасение.
  entry_conditions:
  - До потенциально напряжённой коммуникации; есть риск, что собеседник негативно интерпретирует вас/вашу группу.
  do_not_use_when: []
  algorithm:
  - Определить, что собеседник может подумать о вас.
  - Озвучить это наперёд до того, как оно станет конфликтом.
  - Продолжить разговор по теме.
  templates: []
  good_examples: []
  typical_errors: []
  risks: &id001 []
  opportunities: []
  possible_opponent_reactions: []
  next_possible_actions:
  - Оценить реакцию оппонента и выбрать следующий минимально достаточный этап по лестнице конфликтов.
  related_techniques: []
  evaluation:
    correct:
    - Условия входа соответствуют ситуации.
    - Сохранён ключевой механизм приёма из материалов курса.
    - Формулировка не нарушает прямые ограничения приёма.
    partially_correct:
    - Выбран релевантный приём, но пропущен существенный шаг/проверка или формулировка повышает обозначенный в курсе риск.
    incorrect:
    - Приём выбран не для того этапа/механизма либо отсутствует его ключевой элемент.
    harmful_or_risky: *id001
  source_refs:
  - file: НИУ ВШЭ'26_Лекция 1-2(4).pdf
    page: 46
    context: 'Аудит негатива: говорить наперёд, что человек может подумать; источники — стереотипы и собственные опасения.'
    confidence: explicit
  - file: НИУ ВШЭ Лекция 4-5.pdf
    page: 60
    context: Аудит негатива как предотвращение конфликта.
    confidence: explicit
  confidence: explicit
