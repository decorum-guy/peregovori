- id: emotion.union_inference
  russian_name: Объединение через домысливание
  skill_group: conflict_management
  purpose: Показать эмпатию, когда такого опыта нет, но можно представить себя на месте человека.
  entry_conditions:
  - Подозрение на эмоцию.
  - Нельзя честно сказать, что переживали то же, но можно представить.
  do_not_use_when: []
  algorithm:
  - Сформулировать, какую эмоцию вы бы испытали в аналогичной ситуации.
  - Не утверждать, что полностью понимаете собеседника.
  templates:
  - '`Я бы тоже <эмоция> <чему-то>, если бы...`'
  good_examples:
  - '`Я бы тоже <эмоция> <чему-то>, если бы...`'
  typical_errors:
