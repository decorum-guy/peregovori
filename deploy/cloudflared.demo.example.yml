# Fill these three values after purchasing a domain and creating a named tunnel.
tunnel: REPLACE_TUNNEL_UUID
credentials-file: /Users/REPLACE_MAC_USER/.cloudflared/REPLACE_TUNNEL_UUID.json
protocol: http2

ingress:
  - hostname: REPLACE_PUBLIC_HOSTNAME
    service: http://127.0.0.1:8000
  - service: http_status:404
